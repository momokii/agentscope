# opencode mission control — plug-n-play single-container deployment (W4-1).
#
# Host prerequisites (verify on the TARGET machine before `up`):
#   echo $XDG_RUNTIME_DIR        # socket source path below must match
#   id -u                        # UID/GID below default from the host env
#   zellij --version              # major must match the baked CLI (see Dockerfile)
#
# Mount allowlist (NOTHING else enters the container):
#   - opencode/ parent dir :ro  -> /data/opencode   (DB + storage; WAL decision below)
#   - zellij socket dir   :rw  -> same path         (CLI liveness + dump-screen;
#     read-write is REQUIRED, see the socket volume note below)
#   - zellij cache dir    :ro  -> /data/zellij-cache (EXITED-session metadata)
#   NEVER mounted: auth.json, credential/account* tables, the whole home dir.
#   The dashboard needs no opencode credentials for read-only monitoring.
#
# WAL-MOUNT DECISION (binding): mount the PARENT .../opencode/ directory
# read-only — NOT the opencode.db file alone. SQLite WAL mode keeps live
# state in opencode.db-wal / -shm SIDECARS next to the main file; mounting
# only the file hides the sidecars from the reader, so the dashboard would
# serve stale snapshots (blind dashboard) while looking healthy. The parent
# mount keeps db+wal+shm siblings visible together. :ro keeps the live TUI
# writers undisturbed (reader opens mode=ro + query_only=ON).
#
# EXITED-session semantics: EXITED zellij sessions are serialized metadata
# only — "resurrecting" RE-RUNS the recorded commands, it never resumes the
# old processes. The dashboard reports them; it never resurrects (v1 is
# read-only; abort/resurrect are deferred to a later wave — see
# docs/ACTIONS_DEFERRED.md).
#
# Network: HOST mode (network_mode: "host") — the Go binary binds 127.0.0.1
# (asserted in-code at startup, never 0.0.0.0), which in the host netns IS
# host loopback. There is NO publish/NAT hop: the old
# "127.0.0.1:${PORT:-8080}:8080" bridge-publish model is SUPERSEDED —
# bridge DNAT targets the container eth0 IP, which a container-loopback
# bind never answers ("healthy but unreachable": green in-netns
# healthcheck, RST from the host). Host mode removes the NAT hop entirely.
# Exposure boundary unchanged: nothing listens on non-loopback.
# Tailnet exposure is via `tailscale serve <port>` — `funnel` is BANNED
# (public internet). Optional basic-auth + tailnet ACLs are W4-2's.

services:
  dashboard:
    build: .
    image: opencode-dashboard:0.1.0
    # Share the host PID namespace: /proc/<pid> liveness reads host PIDs 1:1
    # (Netdata pattern). Lets the runtime join see host opencode procs.
    pid: "host"
    # Share the host NETWORK namespace: the 127.0.0.1 bind lands on HOST
    # loopback directly (same pattern as pid:host, extended — this IS a
    # monitoring agent: it already joins host PID + :ro host mounts).
    # No `ports:` stanza: it is IGNORED under host mode, so none exists
    # (a commented-out block would be misleading clutter — deleted, not hidden).
    network_mode: "host"
    # MUST match the host user at RUNTIME (zellij sockets are 0700 —
    # same-user is effectively mandatory). Never baked into the image.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # MUST equal the host value (`echo $XDG_RUNTIME_DIR`): the zellij CLI
      # resolves its sockets from this variable, so path parity matters.
      # If the host value differs, change BOTH this and the socket volume
      # source below to that exact path.
      XDG_RUNTIME_DIR: /run/user/${UID:-1000}
      # Substituted from the host env; used only for XDG fallback
      # resolution — the home dir itself is NEVER mounted (see allowlist).
      HOME: ${HOME:-/home/hostuser}
      DATA_DIR: /data/opencode
      POLL_INTERVAL: ${POLL_INTERVAL:-10s}
      # Host mode has NO port mapping — the container's listen port IS the
      # host port, so the operator's $PORT must flow through here (the old
      # "container side fixed at 8080" model is gone with the `ports:` stanza).
      PORT: "${PORT:-8080}"
      # Bind posture (default loopback-only — zero behavior change when
      # unset). Opt-in ONLY: BIND_ADDR=0.0.0.0 exposes the dashboard on all
      # interfaces (e.g. direct http://<tailnet-ip>:$PORT without
      # `tailscale serve`) and the binary REFUSES to start unless HTTP
      # Basic auth is also enabled (DASHBOARD_AUTH=user:pass). Tailnet-only
      # assumption: never use a non-loopback bind on a publicly reachable
      # host — full transcripts are readable by anyone who can reach the
      # port. Prefer `tailscale serve` (HTTPS + identity) when possible.
      BIND_ADDR: "${BIND_ADDR:-127.0.0.1}"
      # Empty = open tailnet-trust mode (unchanged default; only meaningful
      # paired with non-loopback BIND_ADDR). Value never logged — see
      # internal/auth no-log pin.
      DASHBOARD_AUTH: "${DASHBOARD_AUTH:-}"
      # Local-time attribution: cost_today is "since LOCAL midnight" and log
      # lines are stamped in local time. Without a zone the container runs in
      # UTC, so "today" would start hours early on e.g. a WIB host.
      # /etc/localtime is bind-mounted below (Go resolves the host zone even
      # when TZ is empty); deploy.sh exports TZ from the host automatically.
      TZ: "${TZ:-}"
    volumes:
      # WAL decision (see header): parent dir :ro keeps -wal/-shm visible.
      - ${HOME:-/home/hostuser}/.local/share/opencode:/data/opencode:ro
      # EXITED/resurrect metadata (read-only).
      - ${HOME:-/home/hostuser}/.cache/zellij:/data/zellij-cache:ro
      # Live zellij sockets (0700 — requires user: parity above). Source
      # path must equal $XDG_RUNTIME_DIR/zellij on the host.
      # Read-write is REQUIRED here (no :ro): the zellij CLI creates a
      # per-invocation client socket inside XDG_RUNTIME_DIR to talk to the
      # server, so a read-only mount fails every pane query with EROFS
      # (ReadOnlyFilesystem: list-panes and dump-screen both die). Safe to
      # allow: the dashboard only issues read-only zellij queries
      # (list-sessions, list-panes, dump-screen) — never attach, kill,
      # resurrect, or delete-session — and same-UID parity already holds.
      - /run/user/${UID:-1000}/zellij:/run/user/${UID:-1000}/zellij
      # Host timezone (read-only): makes "cost today" boundary the operator's
      # local midnight inside a zone-less container image.
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      # Exec-form: the binary probes its own /api/healthz (no shell/curl in
      # the distroless runtime). Probes host 127.0.0.1:$PORT (host mode:
      # container $PORT IS the host listen port).
      test: ["CMD", "/app/dashboard", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
